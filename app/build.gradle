plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.edward.dogcare'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edward.dogcare'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
        ndk { abiFilters 'arm64-v8a' }
    }

    // Chave fixa: cada APK novo instala por cima do anterior sem perder dados.
    signingConfigs {
        release {
            storeFile file('../keystore/dogcare.jks')
            storePassword 'dogcare-sideload'
            keyAlias 'dogcare'
            keyPassword 'dogcare-sideload'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}

dependencies {
    // IA local (Gemma) no aparelho. Opcional em tempo de execução: sem modelo, o app funciona igual.
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
}
